import groovy.json.JsonSlurper
import java.util.Properties

pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
                includeGroup('fabric-loom')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups("org.spongepowered")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Forge'
                    url = uri('https://maven.minecraftforge.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.minecraftforge')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'NeoForge'
                    url = uri('https://maven.neoforged.net/releases')
                }
            }
            filter {
                includeGroupAndSubgroups('net.neoforged')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'kiss'

def versionsIndex = new JsonSlurper().parse(file('versions.json'))
if (!(versionsIndex.versions instanceof List) || versionsIndex.versions.isEmpty()) {
    throw new GradleException("versions.json must contain a non-empty 'versions' list")
}
if (versionsIndex.versions.toSet().size() != versionsIndex.versions.size()) {
    throw new GradleException('versions.json must not contain duplicate version IDs')
}

def requestedComponentsByVersion = [:].withDefault { [] as Set }
def requestedVersionIds = gradle.startParameter.taskNames.collect { String taskName ->
    def matcher = (taskName =~ /^:([^:]+)(?::([^:]+))?(?::.*)?$/)
    if (!matcher.matches()) {
        return null
    }

    String versionId = matcher.group(1)
    if (!versionsIndex.versions.contains(versionId)) {
        return null
    }
    String component = matcher.group(2)
    if (component in ['common', 'fabric', 'neoforge']) {
        requestedComponentsByVersion[versionId].add(component)
    }
    versionId
}.findAll { it != null }.toSet()
String activeVersionId = providers.gradleProperty('kissActiveVersion').orNull
if (activeVersionId != null && !versionsIndex.versions.contains(activeVersionId)) {
    throw new GradleException(
            "Unknown kissActiveVersion '${activeVersionId}'; expected one of ${versionsIndex.versions.join(', ')}")
}
def versionIdsToInclude = !requestedVersionIds.isEmpty()
        ? versionsIndex.versions.findAll { requestedVersionIds.contains(it) }
        : (activeVersionId == null ? versionsIndex.versions : [activeVersionId])

def requiredBoolean = { Properties props, String key, String versionId ->
    String value = props.getProperty(key)
    if (!(value in ['true', 'false'])) {
        throw new GradleException(
                "Version '${versionId}' has invalid boolean field '${key}'; expected 'true' or 'false'")
    }
    Boolean.parseBoolean(value)
}

for (String versionId : versionIdsToInclude) {
    def props = new Properties()
    def propsFile = file("versions/${versionId}/gradle.properties")
    if (!propsFile.isFile()) {
        throw new GradleException("Missing version properties file '${propsFile}'")
    }
    propsFile.withInputStream { props.load(it) }

    Set<String> requestedComponents = requestedComponentsByVersion[versionId]
    boolean includeAllLoaders = requestedComponents.isEmpty()
    boolean enableFabric = requiredBoolean(props, 'enable_fabric', versionId)
    boolean enableNeoForge = requiredBoolean(props, 'enable_neoforge', versionId)

    include(":${versionId}")
    project(":${versionId}").projectDir = file("versions/${versionId}")

    include(":${versionId}:common")
    project(":${versionId}:common").projectDir = file('common')

    if (enableFabric && (includeAllLoaders || requestedComponents.contains('fabric'))) {
        include(":${versionId}:fabric")
        project(":${versionId}:fabric").projectDir = file('fabric')
    }

    if (enableNeoForge && (includeAllLoaders || requestedComponents.contains('neoforge'))) {
        include(":${versionId}:neoforge")
        project(":${versionId}:neoforge").projectDir = file('neoforge')
    }
}
