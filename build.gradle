import com.kissmod.build.VersionManifest

plugins {
    id 'com.diffplug.spotless' version '8.8.0'
    id 'com.github.spotbugs' version '6.5.9' apply false
    id 'fabric-loom' version '1.17-SNAPSHOT' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'net.neoforged.gradle.userdev' version '7.1.36' apply false
}

def kissManifest = VersionManifest.load(file('versions.json'))

repositories {
    mavenCentral()
}

spotless {
    encoding 'UTF-8'

    java {
        target 'common/src/**/*.java', 'fabric/src/**/*.java', 'neoforge/src/**/*.java'
        lineEndings = 'UNIX'
        importOrder()
        removeUnusedImports()
        googleJavaFormat('1.29.0')
        formatAnnotations()
        trimTrailingWhitespace()
        endWithNewline()
    }

    format 'textBuildFiles', {
        target '.editorconfig', '.gitattributes', '.gitignore', 'gradle/*.properties', 'gradle/wrapper/*.properties'
        lineEndings = 'UNIX'
        trimTrailingWhitespace()
        endWithNewline()
    }

    format 'gradleBuildFiles', {
        target '*.gradle', 'buildSrc/**/*.gradle', 'common/*.gradle', 'fabric/*.gradle', 'neoforge/*.gradle'
        lineEndings = 'WINDOWS'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

subprojects {
    if (project.path.count(':') == 2) {
        def versionId = project.path.split(':')[1]
        def loader = project.path.split(':')[2]
        def versionData = VersionManifest.findById(kissManifest, versionId)

        ext.kissManifest = kissManifest
        ext.kissVersionData = versionData
        ext.kissVersionId = versionId
        ext.kissLoader = loader
        ext.kissCommonProjectPath = VersionManifest.projectPath(versionId, 'common')

        layout.buildDirectory.set(rootProject.layout.buildDirectory.dir("${versionId}/${loader}"))
    }
}

subprojects {
    pluginManager.withPlugin('java') {
        apply plugin: 'com.github.spotbugs'

        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }

        spotbugs {
            toolVersion = '4.10.2'
            ignoreFailures = false
            showStackTraces = true
            showProgress = true
            effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
            reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
            maxHeapSize = '1g'
            excludeFilter = rootProject.file('config/spotbugs/exclude.xml')
        }

        tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
            reports {
                xml.required.set(true)
                xml.outputLocation.set(layout.buildDirectory.file("reports/spotbugs/${name}.xml"))
                html.required.set(true)
                html.outputLocation.set(layout.buildDirectory.file("reports/spotbugs/${name}.html"))
                html.stylesheet = 'fancy-hist.xsl'
            }
        }

        tasks.named('check') {
            dependsOn(rootProject.tasks.named('spotlessCheck'))
        }
    }
}
