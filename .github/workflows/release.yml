name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Strict release tag to validate and build (dry-run only)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      release_tag: ${{ steps.tag.outputs.value }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN || secrets.MODRINTH_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install release dependencies
        run: python -m pip install --requirement scripts/release-requirements.txt
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${DISPATCH_TAG}"
          fi
          echo "value=${tag}" >> "$GITHUB_OUTPUT"
      - name: Resolve and validate release plan
        id: plan
        shell: bash
        run: |
          python scripts/release_plan.py --tag '${{ steps.tag.outputs.value }}' --dry-run --output release-plan.json
          {
            echo "matrix<<EOF"
            python -c 'import json; print(json.dumps(json.load(open("release-plan.json"))["matrix"]))'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Validate publication configuration
        if: github.event_name == 'push'
        shell: bash
        run: |
          missing=0
          for name in GITHUB_TOKEN GITHUB_REPOSITORY CURSEFORGE_PROJECT_ID CURSEFORGE_TOKEN MODRINTH_PROJECT_ID MODRINTH_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository variable or secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"
      - name: Warn about manual CurseForge conflict check
        if: github.event_name == 'push'
        run: >-
          echo '::warning::CurseForge existing-file conflicts cannot be checked with an author token.
          Manually delete files matching this release before pushing the tag.'
      - name: Read-only platform preflight
        if: github.event_name == 'push'
        run: >-
          python scripts/release_transaction.py preflight
          --plan release-plan.json
          --repository '${{ github.repository }}'
      - name: Upload release plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resolved-release-plan
          path: release-plan.json
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: prepare
    strategy:
      fail-fast: true
      # Build rows are independent; publication still waits for the complete matrix.
      max-parallel: 25
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java_version }}
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Prepare Gradle target
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ./gradlew '${{ matrix.gradle_task }}' --dry-run --stacktrace --console=plain; then
              exit 0
            fi
            if (( attempt == 3 )); then
              exit 1
            fi
            echo "::warning::Gradle target preparation failed on attempt ${attempt}; retrying in $((attempt * 10)) seconds"
            sleep $((attempt * 10))
          done
      - name: Build target
        shell: bash
        run: |
          set -o pipefail
          ./gradlew '${{ matrix.gradle_task }}' --stacktrace --console=plain 2>&1 | tee build.log
      - name: Verify Fabric GameTests from build
        if: matrix.loader == 'fabric'
        run: python scripts/verify_gametest.py build.log
      - name: Run NeoForge GameTests
        if: matrix.loader == 'neoforge'
        shell: bash
        run: |
          set -o pipefail
          ./gradlew '${{ matrix.gametest_task }}' --console=plain 2>&1 | tee gametest.log
          python scripts/verify_gametest.py gametest.log
      - name: Select, validate, and checksum deployable JAR
        run: >-
          python scripts/prepare_release_artifact.py
          --source-dir build/${{ matrix.version_id }}/${{ matrix.loader }}/libs
          --output-dir release-artifact
          --artifact-name '${{ matrix.artifact_name }}'
          --loader ${{ matrix.loader }}
      - name: Upload release row
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.version_id }}-${{ matrix.loader }}
          path: release-artifact/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN || secrets.MODRINTH_AUTH_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install release dependencies
        run: python -m pip install --requirement scripts/release-requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: resolved-release-plan
          path: release-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binary-*
          path: release-artifacts
          merge-multiple: true
      - name: Publish transaction
        run: >-
          python scripts/release_transaction.py publish
          --plan release-input/release-plan.json
          --artifact-dir release-artifacts
          --repository '${{ github.repository }}'
          --recovery release-recovery/release-recovery.json
      - name: Upload publication journal
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-journal-${{ needs.prepare.outputs.release_tag }}
          path: release-recovery/**
          if-no-files-found: warn
          retention-days: 30
