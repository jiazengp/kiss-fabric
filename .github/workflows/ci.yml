name: CI

on:
  push:
    branches:
      - "**"
    paths:
      - "*.gradle"
      - ".editorconfig"
      - ".gitattributes"
      - "config/**"
      - "gradle.properties"
      - "gradle/wrapper/**"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle"
      - "buildSrc/**"
      - "common/**"
      - "fabric/**"
      - "neoforge/**"
      - "versions/**"
      - "versions.json"
      - "release-metadata.json"
      - "scripts/**"
      - "tests/**"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - ".github/workflows/**"
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install release dependencies
        run: python -m pip install --requirement scripts/release-requirements.txt
      - name: Validate manifest and Python tests
        run: |
          python scripts/manifest_matrix.py validate
          python -m unittest discover -s tests -v
      - name: Test shared Gradle build logic and formatting
        run: ./gradlew -PkissActiveVersion=v1_21_5 :buildSrc:test :spotlessCheck --console=plain
      - name: Generate manifest matrix
        id: matrix
        shell: bash
        run: |
          {
            echo "matrix<<EOF"
            python scripts/manifest_matrix.py matrix
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-and-gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: preflight
    strategy:
      fail-fast: true
      # Allow the complete current matrix to fan out; lower account limits queue excess rows.
      max-parallel: 25
      matrix: ${{ fromJson(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java_version }}
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Build target
        shell: bash
        run: |
          set -o pipefail
          ./gradlew '${{ matrix.gradle_task }}' -x spotlessCheck --console=plain 2>&1 | tee build.log
      - name: Verify Fabric GameTests from build
        if: matrix.loader == 'fabric'
        run: python scripts/verify_gametest.py build.log
      - name: Run NeoForge GameTests
        if: matrix.loader == 'neoforge'
        shell: bash
        run: |
          set -o pipefail
          ./gradlew '${{ matrix.gametest_task }}' --console=plain 2>&1 | tee gametest.log
          python scripts/verify_gametest.py gametest.log
      - name: Select and validate deployable JAR
        run: >-
          python scripts/prepare_release_artifact.py
          --source-dir build/${{ matrix.version_id }}/${{ matrix.loader }}/libs
          --output-dir ci-artifact
          --artifact-name kissmod-${{ matrix.version_id }}-${{ matrix.loader }}.jar
          --loader ${{ matrix.loader }}
      - name: Upload deployable JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.version_id }}-${{ matrix.loader }}-jar
          path: ci-artifact/*
          if-no-files-found: error
