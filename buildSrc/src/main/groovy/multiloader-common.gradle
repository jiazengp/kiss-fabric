plugins {
    id 'java-library'
    id 'maven-publish'
}

def kissVersion = project.ext.kissVersionData
def minecraftVersion = kissVersion.minecraft_version
def minecraftVersionRange = kissVersion.minecraft_version_range
def fabricMinecraftVersion = kissVersion.fabric_minecraft_version ?: minecraftVersion
def javaVersion = kissVersion.java_version as Integer
def fabricConfig = kissVersion.fabric as Map
def neoforgeConfig = kissVersion.neoforge as Map
def fabricApiVersion = fabricConfig.fabric_api_version
def fabricLoaderVersion = fabricConfig.fabric_loader_version
def neoforgeVersion = neoforgeConfig.neoforge_version
def neoforgeLoaderVersionRange = neoforgeConfig.neoforge_loader_version_range
def modName = project.property('mod_name').toString()

base {
    archivesName = "${mod_id}-${project.name}-${minecraftVersion}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
    // Loader artifacts are distributed as mods, not as a public Java API.
    withSourcesJar()
}

repositories {
    mavenCentral()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${project.name}:$version")
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraftVersion}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${modName}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${modName}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : modName,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraftVersion
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : minecraftVersion,
            'minecraft_version_range'      : minecraftVersionRange,
            'fabric_minecraft_version'     : fabricMinecraftVersion,
            'fabric_version'               : fabricApiVersion,
            'fabric_loader_version'        : fabricLoaderVersion,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforgeVersion,
            'neoforge_loader_version_range': neoforgeLoaderVersionRange,
            'credits'                      : credits,
            'java_version'                 : javaVersion
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url = System.getenv('local_maven_url')
        }
    }
}
